services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: drone_control_pilot
      POSTGRES_PASSWORD: "NvGy2Uzqqc-WFgWcjU9QBtyksZ5ZZz9m"
    volumes:
      - drone_control_pilot_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "rKAAQpHkNqQvHN2dL9T4FWl2U1_nyYMP"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: drone_control_pilot_test
      POSTGRES_PASSWORD: "nRqPmFuc7yHT6Yjk0xFCXNcwi8rfcc67"
    volumes:
      - drone_control_pilot_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "hAwnDS_hpGb9efn-zg11er8qqA1jMngU"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  drone_control_pilot_data:
  drone_control_pilot_test_data:
